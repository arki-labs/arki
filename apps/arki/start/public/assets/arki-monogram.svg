<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512"
     role="img"
     aria-label="arki">
  <title>arki — square monogram</title>
  <defs>
    <style type="text/css"><![CDATA[
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap");
      .arki-mono {
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 340px;
        letter-spacing: -0.04em;
        fill: #ececef;
      }
      .arki-mono-orb     { fill: #facc15; }
      .arki-mono-orb-mid { fill: #facc15; opacity: 0.45; filter: url(#mono-glow-mid); }
      .arki-mono-orb-far { fill: #facc15; opacity: 0.22; filter: url(#mono-glow-far); }
    ]]></style>

    <!-- Two-distance phosphor halo around the orb. -->
    <filter id="mono-glow-mid" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="mono-glow-far" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="38" />
    </filter>
  </defs>

  <!-- Row 1: ar — upright, left-aligned. Pure x-height letterforms
       (no ascenders/descenders) leave a clean baseline at y=210. -->
  <text x="56" y="210" class="arki-mono">ar</text>

  <!-- Row 2: ki — upright, sharing AR's left edge. ~22px gap between
       row 1 baseline and row 2 ascender top — composed, not touching. -->
  <text x="56" y="470" class="arki-mono">ki</text>

  <!-- Phosphor orb (the brand's `.`). Three layers: far-bloom, mid-halo,
       crisp core. Positioned to the right of `ki` near baseline. -->
  <circle cx="405" cy="455" r="34" class="arki-mono-orb-far" />
  <circle cx="405" cy="455" r="34" class="arki-mono-orb-mid" />
  <circle cx="405" cy="455" r="34" class="arki-mono-orb" />
</svg>
