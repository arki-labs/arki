<!doctype html>
<html lang="en" data-theme="dark" data-density="compact" data-footer="rich">
<head>
  <meta charset="utf-8">
  <title>Why — arki.dev</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="src/assets/favicon.svg">
  <link rel="stylesheet" href="src/app.css">
  <link rel="stylesheet" href="src/why.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- shared chrome + bands + primitives -->
  <script type="text/babel" src="src/components/primitives.jsx"></script>
  <script type="text/babel" src="src/components/chrome.jsx"></script>
  <script type="text/babel" src="src/components/footer-bands.jsx"></script>
  <script type="text/babel" src="src/components/boot-dag.jsx"></script>

  <!-- tweaks shell + the Why screen -->
  <script type="text/babel" src="src/tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/screens/Why.jsx"></script>

  <script type="text/babel">
    const { useEffect: useEffectWhy } = React;

    // Tweaks shape mirrors the rest of the site. Class F is the default
    // band on the Why page: peak burst on first paint then settle to
    // class E idle pulse — we approximate that with the existing ASCII
    // band component (the brand's signature peak).
    const TWEAK_DEFAULTS_WHY = /*EDITMODE-BEGIN*/{
      "theme": "dark",
      "density": "compact",
      "footer": "rich",
      "band": "ascii",
      "bandSpeed": 850,
      "leadWith": "composition"
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS_WHY);

      useEffectWhy(() => {
        document.documentElement.dataset.theme   = t.theme;
        document.documentElement.dataset.density = t.density;
        document.documentElement.dataset.footer  = t.footer;
      }, [t.theme, t.density, t.footer]);

      // Iteration affordance: lead with PRATFALL (Section 3 above Section 2)
      // or keep doctrine order (composition → comparison → not-for → value).
      useEffectWhy(() => {
        const root = document.querySelector(".why");
        if (!root) return;
        root.dataset.leadWith = t.leadWith;
        // Visual-only reorder via flex-order so the DOM stays semantic.
        const s2 = root.querySelector("#comparison")?.closest(".why-col");
        const s3 = root.querySelector("#not-for")?.closest(".why-col");
        if (s2 && s3) {
          if (t.leadWith === "pratfall") {
            s2.style.order = "3"; s3.style.order = "2";
          } else {
            s2.style.order = ""; s3.style.order = "";
          }
        }
      }, [t.leadWith]);

      const setThemeBridge = (next) => setTweak("theme", next);

      return (
        <div className="shell" data-screen-label="01 Why">
          <Nav route="philosophy" setRoute={() => {}}
               theme={t.theme} setTheme={setThemeBridge} />

          <div className="body-wrap">
            <Why />
          </div>

          <StatusBar route="philosophy" />

          {t.band === "boot-dag" && <BandBootDag tickMs={t.bandSpeed} />}
          {t.band === "ascii"    && <ASCIIBand />}
          {t.band === "ticker"   && <BandTicker />}
          {t.band === "graph"    && <BandGraph />}
          {t.band === "monitor"  && <BandMonitor />}
          {t.band === "kinetic"  && <BandKinetic />}
          {t.band === "pipeline" && <BandPipeline />}

          <TweaksPanel title="Tweaks" defaultOpen={false}>
            <TweakSection label="Theme & density" />
            <TweakRadio  label="Theme"   value={t.theme}
                         options={["dark", "light"]}
                         onChange={(v) => setTweak("theme", v)} />
            <TweakRadio  label="Density" value={t.density}
                         options={["dense", "compact", "comfy"]}
                         onChange={(v) => setTweak("density", v)} />
            <TweakRadio  label="Footer"  value={t.footer}
                         options={["minimal", "rich"]}
                         onChange={(v) => setTweak("footer", v)} />

            <TweakSection label="Structural lead (C10)" />
            <TweakRadio  label="Lead with" value={t.leadWith}
                         options={["composition", "pratfall"]}
                         onChange={(v) => setTweak("leadWith", v)} />

            <TweakSection label="ASCII band (C11)" />
            <TweakSelect label="Band variant" value={t.band}
                         options={[
                           "boot-dag", "ascii", "ticker",
                           "graph", "monitor", "kinetic", "pipeline",
                         ]}
                         onChange={(v) => setTweak("band", v)} />
            <TweakSlider label="Boot tick"  value={t.bandSpeed}
                         min={400} max={1600} step={50} unit="ms"
                         onChange={(v) => setTweak("bandSpeed", v)} />
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
