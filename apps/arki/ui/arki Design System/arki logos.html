<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>arki — logo explorations</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:        oklch(0.18 0.012 250);
    --paper:      oklch(0.965 0.006 85);
    --muted:      oklch(0.55 0.01 250);
    --muted-dark: oklch(0.62 0.012 250);
    --accent:     oklch(0.82 0.18 130);
    --rule:       oklch(0.85 0.01 250);
    --mono:       'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    --display:    'Space Grotesk', system-ui, sans-serif;
  }
  html, body { margin: 0; padding: 0; background: #1a1a1c; }
  body { font-family: var(--display); color: var(--paper); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="logos.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function App() {
    return (
      <DesignCanvas title="arki — logo explorations" subtitle="arki.dev primary marks · @arki/dot sub-package marks">
        <DCSection id="intro" title="Direction">
          <DCArtboard id="cover" label="Identity v0.1" width={1200} height={760}>
            <CoverPlate />
          </DCArtboard>
        </DCSection>

        <DCSection id="arki-dev" title="arki.dev — primary marks">
          <DCArtboard id="l01" label="01 · Monospace wordmark" width={900} height={560}><L01_Monomark/></DCArtboard>
          <DCArtboard id="l11" label="11 · Block period" width={900} height={560}><L11_CursorPeriod/></DCArtboard>
          <DCArtboard id="l02" label="02 · Terminal prompt" width={900} height={560}><L02_Prompt/></DCArtboard>
          <DCArtboard id="l04" label="04 · Bracketed" width={900} height={560}><L04_Brackets/></DCArtboard>
          <DCArtboard id="l09" label="09 · Inline comment" width={900} height={560}><L09_Comment/></DCArtboard>
          <DCArtboard id="l07" label="07 · Namespace slash" width={900} height={560}><L07_Slash/></DCArtboard>
          <DCArtboard id="l03" label="03 · Arch mark" width={900} height={560}><L03_Arch/></DCArtboard>
          <DCArtboard id="l05" label="05 · Chevron pair" width={900} height={560}><L05_Chevron/></DCArtboard>
          <DCArtboard id="l06" label="06 · ‘a’ monogram" width={900} height={560}><L06_Monogram/></DCArtboard>
          <DCArtboard id="l10" label="10 · Line arch · stacked" width={900} height={560}><L10_LineArch/></DCArtboard>
          <DCArtboard id="l12" label="12 · App-tile lockup" width={900} height={560}><L12_Banner/></DCArtboard>
          <DCArtboard id="l08" label="08 · Lockup + tagline" width={1100} height={560}><L08_Lockup/></DCArtboard>
        </DCSection>

        <DCSection id="arki-dot" title="@arki/dot — sub-package marks">
          <DCArtboard id="d1" label="D1 · Package wordmark" width={900} height={520}><D01_Wordmark/></DCArtboard>
          <DCArtboard id="d2" label="D2 · Hero dot" width={900} height={520}><D02_HeroDot/></DCArtboard>
          <DCArtboard id="d5" label="D5 · The period" width={900} height={520}><D05_Period/></DCArtboard>
          <DCArtboard id="d3" label="D3 · Node series" width={900} height={520}><D03_Ellipsis/></DCArtboard>
          <DCArtboard id="d4" label="D4 · Tile + name" width={900} height={520}><D04_Tile/></DCArtboard>
          <DCArtboard id="d6" label="D6 · Pill badge" width={900} height={520}><D06_Pill/></DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
