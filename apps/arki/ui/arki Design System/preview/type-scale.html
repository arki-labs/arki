<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Type — Scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 18px 24px; }
  table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted-foreground); font-weight: 400; text-transform: uppercase; letter-spacing: 0.04em; font-size: 10px; }
  td.k { color: var(--accent); }
  td.v { color: var(--foreground); }
  td.f { color: var(--muted-foreground); }
  tr:last-child td { border-bottom: none; }
</style></head>
<body><div class="card">
  <table>
    <thead><tr><th>role</th><th>family</th><th>size/line</th><th>wt</th><th>tracking</th></tr></thead>
    <tbody>
      <tr><td class="k">display</td><td class="f">sans</td><td class="v">56/60</td><td class="v">600</td><td class="v">−0.03em</td></tr>
      <tr><td class="k">h1</td><td class="f">sans</td><td class="v">36/44</td><td class="v">600</td><td class="v">−0.02em</td></tr>
      <tr><td class="k">h2</td><td class="f">sans</td><td class="v">24/32</td><td class="v">600</td><td class="v">−0.015em</td></tr>
      <tr><td class="k">h3</td><td class="f">sans</td><td class="v">18/28</td><td class="v">600</td><td class="v">−0.01em</td></tr>
      <tr><td class="k">body</td><td class="f">sans</td><td class="v">14/22</td><td class="v">400</td><td class="v">0</td></tr>
      <tr><td class="k">body-rm</td><td class="f">sans</td><td class="v">17/28</td><td class="v">400</td><td class="v">0</td></tr>
      <tr><td class="k">caption</td><td class="f">sans</td><td class="v">12/18</td><td class="v">400</td><td class="v">+0.01em</td></tr>
      <tr><td class="k">mono</td><td class="f">mono</td><td class="v">13/20</td><td class="v">400</td><td class="v">0</td></tr>
      <tr><td class="k">quote</td><td class="f">serif</td><td class="v">22/32 <i>italic</i></td><td class="v">400</td><td class="v">−0.005em</td></tr>
    </tbody>
  </table>
</div></body></html>
