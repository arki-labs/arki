<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing — Elevation = bordered, no shadow</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 18px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .demo {
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    padding: 14px 16px; min-height: 96px;
  }
  .demo .ttl { font-family: var(--font-sans); font-size: 13px; font-weight: 500; color: var(--foreground); }
  .demo .body { font-family: var(--font-sans); font-size: 12px; color: var(--muted-foreground); line-height: 17px; margin-top: 4px; }
  .demo.hover { border-color: hsl(240 6% 90% / 0.4); }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); margin-top: 8px; letter-spacing: 0.02em; }
</style></head>
<body><div class="card">
  <div>
    <div class="demo">
      <div class="ttl">@arki/db</div>
      <div class="body">Adapter for Postgres, MySQL, SQLite. Owns its own migration story.</div>
    </div>
    <div class="label">DEFAULT · 1px solid --border · no shadow</div>
  </div>
  <div>
    <div class="demo hover">
      <div class="ttl">@arki/db</div>
      <div class="body">Adapter for Postgres, MySQL, SQLite. Owns its own migration story.</div>
    </div>
    <div class="label">HOVER · border shifts to --primary at 40% · no lift, no shadow</div>
  </div>
</div></body></html>
