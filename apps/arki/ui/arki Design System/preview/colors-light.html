<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colors — Light (printed man page)</title>
<link rel="stylesheet" href="_card.css">
<style>
  html { background: #f4f4f5; color: #09090b; }
  .card { background: #f4f4f5; padding: 18px 24px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 4px; }
  .chip { height: 56px; border-radius: 6px; border: 1px solid #d4d4d8; }
  .name { font-family: var(--font-mono); font-size: 11px; color: #09090b; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: #71717a; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#f4f4f5"></div><div class="name">background</div><div class="hex">#f4f4f5</div></div>
    <div class="sw"><div class="chip" style="background:#efeff1"></div><div class="name">card</div><div class="hex">#efeff1</div></div>
    <div class="sw"><div class="chip" style="background:#e4e4e7"></div><div class="name">muted</div><div class="hex">#e4e4e7</div></div>
    <div class="sw"><div class="chip" style="background:#d4d4d8"></div><div class="name">border</div><div class="hex">#d4d4d8</div></div>
    <div class="sw"><div class="chip" style="background:#71717a"></div><div class="name">muted-fg</div><div class="hex">#71717a</div></div>
    <div class="sw"><div class="chip" style="background:#09090b"></div><div class="name">foreground</div><div class="hex">#09090b</div></div>
  </div>
</div></body></html>
