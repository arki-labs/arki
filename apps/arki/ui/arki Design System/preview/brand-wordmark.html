<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Brand — Wordmark</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px 24px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .wordmark {
    font-family: var(--font-mono); font-size: 56px; font-weight: 500; letter-spacing: -0.02em;
    color: var(--foreground); line-height: 1;
  }
  .wordmark .accent { color: var(--accent); }
  .wordmark .dim { color: var(--muted-foreground); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); display: flex; gap: 14px; flex-wrap: wrap; }
  .meta b { color: var(--foreground); font-weight: 400; }
</style></head>
<body><div class="card">
  <div class="wordmark">arki<span class="accent">.</span><span class="dim">dot</span></div>
  <div class="meta">
    <span><b>arki</b> = ecosystem</span>
    <span><b>.</b> = brand mark (literal period · amber)</span>
    <span><b>dot</b> = kernel</span>
    <span>always lowercase · geist mono 500</span>
  </div>
</div></body></html>
