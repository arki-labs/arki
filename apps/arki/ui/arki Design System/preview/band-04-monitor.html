<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Footer band — 04 Monitor</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; }
  .band { background: var(--background); height: 168px; display: grid; grid-template-columns: 200px 1fr; align-items: center; }
  .side { height: 100%; padding: 18px 20px; border-right: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center;
    background: linear-gradient(90deg, transparent, hsl(240 6% 14% / 0.25)); }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; }
  .title { font-family: var(--font-sans); font-size: 18px; font-weight: 600; color: var(--foreground); margin-top: 4px; letter-spacing: -0.01em; }
  .sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); margin-top: 4px; }
  .grid { padding: 16px 28px; display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 64px 1fr 110px; gap: 14px; align-items: center; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); letter-spacing: 0.04em; text-transform: uppercase; }
  .bar { height: 6px; background: var(--muted); border-radius: 9999px; overflow: hidden; }
  .fill { height: 100%; border-radius: 9999px; animation: drift 3.6s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(0); } }
  .val { font-family: var(--font-mono); font-size: 13px; font-feature-settings: "tnum"; text-align: right; }
  .unit { color: var(--muted-foreground); font-size: 10px; margin-left: 2px; }
  /* per-row drift animations to show different "live" widths */
  .f-cpu { background: hsl(43 96% 56%); width: 42%; animation: cpu 4s ease-in-out infinite alternate; }
  .f-mem { background: hsl(217 85% 65%); width: 68%; animation: mem 5s ease-in-out infinite alternate; }
  .f-req { background: hsl(142 65% 55%); width: 54%; animation: req 3s ease-in-out infinite alternate; }
  .f-err { background: hsl(0 63% 60%); width: 12%; animation: err 6s ease-in-out infinite alternate; }
  @keyframes cpu { from { width: 31%; } to { width: 49%; } }
  @keyframes mem { from { width: 64%; } to { width: 72%; } }
  @keyframes req { from { width: 38%; } to { width: 68%; } }
  @keyframes err { from { width: 8%; }  to { width: 18%; } }
</style></head>
<body><div class="card"><div class="band">
  <div class="side">
    <div class="tag">runtime</div>
    <div class="title">production</div>
    <div class="sub">us-east-1 · web-1</div>
  </div>
  <div class="grid">
    <div class="row"><div class="lbl">cpu</div><div class="bar"><div class="fill f-cpu"></div></div><div class="val" style="color:hsl(43 96% 56%)">37<span class="unit">%</span></div></div>
    <div class="row"><div class="lbl">mem</div><div class="bar"><div class="fill f-mem"></div></div><div class="val" style="color:hsl(217 85% 65%)">68<span class="unit">%</span></div></div>
    <div class="row"><div class="lbl">req/s</div><div class="bar"><div class="fill f-req"></div></div><div class="val" style="color:hsl(142 65% 55%)">1240</div></div>
    <div class="row"><div class="lbl">err/s</div><div class="bar"><div class="fill f-err"></div></div><div class="val" style="color:hsl(0 63% 60%)">0.22</div></div>
  </div>
</div></div></body></html>
