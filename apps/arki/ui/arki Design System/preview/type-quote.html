<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Type — Quote (rare)</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 28px; display: flex; flex-direction: column; gap: 10px; }
  .quote {
    font-family: var(--font-serif);
    font-size: 22px; line-height: 32px;
    font-style: italic;
    letter-spacing: -0.005em;
    color: var(--foreground);
    border-left: 2px solid var(--accent);
    padding-left: 14px;
  }
  .cite { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); padding-left: 16px; }
</style></head>
<body><div class="card">
  <div class="quote">A framework that doesn't show its working is a framework that doesn't deserve trust.</div>
  <div class="cite">— public release doctrine §3.1 · /philosophy pull-quote · serif, rare use only</div>
</div></body></html>
