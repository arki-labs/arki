<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px 24px; }
  .display {
    font-size: 56px; line-height: 56px; font-weight: 600; letter-spacing: -0.03em;
    color: var(--foreground);
  }
  .meta { margin-top: 14px; display: flex; gap: 16px; }
  .meta .v { color: var(--foreground); }
  .accent-dot { color: var(--accent); }
</style></head>
<body><div class="card">
  <div class="display">Ship faster<span class="accent-dot">.</span></div>
  <div class="meta value-mono">
    <span>geist · 56/60 · 600</span>
    <span style="color: var(--foreground)">·</span>
    <span>tracking −0.03em</span>
    <span style="color: var(--foreground)">·</span>
    <span>.t-display</span>
  </div>
</div></body></html>
