<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Footer band — 05 Kinetic</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; }
  .band { background: var(--background); height: 168px; display: grid; grid-template-columns: 200px 1fr 56px; align-items: center; }
  .side { height: 100%; padding: 18px 20px; border-right: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center;
    background: linear-gradient(90deg, transparent, hsl(240 6% 14% / 0.25)); }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; }
  .title { font-family: var(--font-sans); font-size: 18px; font-weight: 600; color: var(--foreground); margin-top: 4px; letter-spacing: -0.01em; }
  .sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); margin-top: 4px; }
  .stage { padding: 0 28px; position: relative; overflow: hidden; height: 100%; background: var(--background); }
  .phrase { display: flex; align-items: baseline; gap: 16px; font-family: var(--font-sans); font-weight: 600; font-size: 56px; line-height: 64px; letter-spacing: -0.03em; height: 64px; }
  .lead { color: var(--muted-foreground); }
  .accent { color: var(--foreground); }
  .dot { color: var(--accent); }
  .csub { font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); margin-top: 6px; height: 18px; }

  /* Three stacked phrases that cross-fade in sequence */
  .row { position: absolute; left: 28px; right: 28px; top: 50%; transform: translateY(-50%);
    opacity: 0; animation: fade 9.6s linear infinite; }
  .row .phrase, .row .csub { animation: fade-text 9.6s linear infinite; }
  .row.r1 { animation-delay: 0s; }
  .row.r2 { animation-delay: -3.2s; }
  .row.r3 { animation-delay: -6.4s; }
  @keyframes fade {
    0%, 5%   { opacity: 0; transform: translate(0, -50%) translateY(14px); }
    10%, 30% { opacity: 1; transform: translate(0, -50%) translateY(0); }
    35%, 100% { opacity: 0; transform: translate(0, -50%) translateY(-14px); }
  }
  @keyframes fade-text { 0%, 100% {} }

  .progress { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding-right: 18px; align-items: center; }
  .tick { width: 2px; height: 12px; background: var(--border); border-radius: 1px; }
  .tick.active { height: 22px; background: var(--accent); }
</style></head>
<body><div class="card"><div class="band">
  <div class="side">
    <div class="tag">manifest</div>
    <div class="title">/philosophy</div>
    <div class="sub">cycling brand phrases</div>
  </div>
  <div class="stage">
    <div class="row r1">
      <div class="phrase">
        <span class="lead">ship</span><span class="accent">faster</span><span class="dot">.</span>
      </div>
      <div class="csub">9.2 KB kernel · zero deps</div>
    </div>
    <div class="row r2">
      <div class="phrase">
        <span class="lead">type</span><span class="accent">safe</span><span class="dot">.</span>
      </div>
      <div class="csub">inference, not plumbing</div>
    </div>
    <div class="row r3">
      <div class="phrase">
        <span class="lead">agent</span><span class="accent">native</span><span class="dot">.</span>
      </div>
      <div class="csub">every page has a JSON envelope</div>
    </div>
  </div>
  <div class="progress">
    <div class="tick active"></div>
    <div class="tick"></div>
    <div class="tick"></div>
  </div>
</div></div></body></html>
