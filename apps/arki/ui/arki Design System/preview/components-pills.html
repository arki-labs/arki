<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Components — Status pills</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .pill {
    height: 22px; padding: 0 10px; border-radius: 9999px;
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  }
  .pill.success { background: hsl(142 65% 55% / 0.16); color: #4ade80; }
  .pill.warning { background: hsl(43 96% 60% / 0.16); color: #fbbf24; }
  .pill.info    { background: hsl(217 85% 65% / 0.16); color: #60a5fa; }
  .pill.destructive { background: hsl(0 63% 60% / 0.16); color: #e75858; }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill .glyph { font-family: var(--font-mono); }

  .ascii { font-family: var(--font-mono); font-size: 12px; line-height: 18px;
    background: var(--muted); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 14px; color: var(--foreground); white-space: pre; }
  .ascii .s { color: #4ade80; } .ascii .w { color: #fbbf24; } .ascii .d { color: #e75858; } .ascii .dim { color: var(--muted-foreground); }
</style></head>
<body><div class="card">
  <div class="row">
    <span class="pill success"><span class="dot"></span>passing</span>
    <span class="pill warning"><span class="dot"></span>flaky</span>
    <span class="pill info"><span class="dot"></span>canary</span>
    <span class="pill destructive"><span class="dot"></span>failing</span>
    <span class="pill" style="background: var(--muted); color: var(--muted-foreground)"><span class="dot"></span>idle</span>
  </div>
  <div class="ascii"><span class="s">●</span> @arki/dot         passing  v0.1.0   <span class="dim">build 802cf4e</span>
<span class="s">●</span> @arki/db          passing  v0.1.0
<span class="w">◐</span> @arki/queue       flaky    v0.1.0-rc.3
<span class="d">○</span> @arki/auth        failing  v0.0.9   <span class="dim">2 jobs red</span></div>
</div></body></html>
