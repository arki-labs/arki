<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Brand — Iconography (Phosphor Regular)</title>
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  .card { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; color: var(--foreground); }
  .row i { font-size: 24px; }
  .row .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); }
  .lead { font-family: var(--font-sans); font-size: 12px; color: var(--muted-foreground); line-height: 17px; }
  .lead b { color: var(--foreground); font-weight: 500; }
  .glyphs { display: flex; gap: 14px; align-items: baseline; font-family: var(--font-mono); font-size: 18px; color: var(--foreground); }
  .glyphs span { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
  .glyphs em { font-style: normal; font-family: var(--font-mono); font-size: 9px; color: var(--muted-foreground); }
</style></head>
<body><div class="card">
  <div class="lead"><b>Phosphor Regular</b> · single weight · CLI-credible glyphs preferred · no duotone in chrome</div>
  <div class="row">
    <i class="ph ph-terminal"></i>
    <i class="ph ph-file-code"></i>
    <i class="ph ph-code"></i>
    <i class="ph ph-git-branch"></i>
    <i class="ph ph-package"></i>
    <i class="ph ph-magnifying-glass"></i>
    <i class="ph ph-gear"></i>
    <i class="ph ph-check"></i>
    <i class="ph ph-x"></i>
    <i class="ph ph-caret-right"></i>
    <i class="ph ph-circle"></i>
    <i class="ph ph-circle-fill"></i>
  </div>
  <div class="glyphs">
    <span>●<em>filled</em></span>
    <span>○<em>hollow</em></span>
    <span>◐<em>partial</em></span>
    <span>▸<em>flow</em></span>
    <span>⌘<em>shortcut</em></span>
    <span>⎯<em>sep</em></span>
    <span>→<em>arrow</em></span>
  </div>
</div></body></html>
