<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colors — Chart palette</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 18px 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .swatch { height: 36px; border-radius: 4px; border: 1px solid var(--border); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--foreground); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); }
  .chart {
    font-family: var(--font-mono); font-size: 11px; line-height: 17px;
    background: var(--muted); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 14px; color: var(--muted-foreground); white-space: pre;
  }
  .c1 { color: #fbbf24; } .c2 { color: #4ade80; } .c3 { color: #60a5fa; } .c4 { color: #e75858; } .c5 { color: #94949c; }
</style></head>
<body><div class="card">
  <div class="row">
    <div class="sw"><div class="swatch" style="background:#fbbf24"></div><div class="name">chart-1</div><div class="hex">amber</div></div>
    <div class="sw"><div class="swatch" style="background:#4ade80"></div><div class="name">chart-2</div><div class="hex">green</div></div>
    <div class="sw"><div class="swatch" style="background:#60a5fa"></div><div class="name">chart-3</div><div class="hex">blue</div></div>
    <div class="sw"><div class="swatch" style="background:#e75858"></div><div class="name">chart-4</div><div class="hex">red</div></div>
    <div class="sw"><div class="swatch" style="background:#94949c"></div><div class="name">chart-5</div><div class="hex">zinc</div></div>
  </div>
  <div class="chart"><span class="c1">●</span> amber 47%  <span class="c2">●</span> green 31%  <span class="c3">●</span> blue 12%  <span class="c4">●</span> red 7%  <span class="c5">●</span> zinc 3%
  ▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇</div>
</div></body></html>
