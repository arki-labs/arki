<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Components — Code block (Shiki / github-dark)</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 18px 24px; }
  .block {
    background: var(--muted); border: 1px solid var(--border); border-radius: 6px;
    font-family: var(--font-mono); font-size: 12px; line-height: 19px;
    position: relative; overflow: hidden;
  }
  .head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 12px; border-bottom: 1px solid var(--border);
    color: var(--muted-foreground); font-size: 11px;
  }
  .copy {
    font-family: var(--font-mono); font-size: 11px;
    background: transparent; border: 1px solid var(--border); border-radius: 3px;
    padding: 1px 8px; color: var(--foreground); cursor: pointer;
  }
  pre { padding: 10px 14px; margin: 0; color: var(--foreground); white-space: pre; }
  .kw  { color: #f97583; }    /* keyword */
  .fn  { color: #b392f0; }    /* function */
  .str { color: #9ecbff; }    /* string */
  .var { color: #79b8ff; }    /* identifier */
  .com { color: var(--muted-foreground); }
  .prov { padding: 6px 12px; border-top: 1px solid var(--border); color: var(--muted-foreground); font-size: 10px; display: flex; justify-content: space-between; }
  .prov a { color: var(--accent); text-decoration: none; }
</style></head>
<body><div class="card">
  <div class="block">
    <div class="head"><span>typescript</span><button class="copy">Copy</button></div>
<pre><span class="kw">import</span> { <span class="fn">defineApp</span> } <span class="kw">from</span> <span class="str">'@arki/dot'</span>;
<span class="kw">import</span> { <span class="fn">db</span> } <span class="kw">from</span> <span class="str">'@arki/db/dot'</span>;

<span class="kw">export const</span> <span class="var">app</span> = <span class="kw">await</span> <span class="fn">defineApp</span>(<span class="str">'billing'</span>)
  .<span class="fn">use</span>(<span class="fn">db</span>({ schema }))
  .<span class="fn">boot</span>();</pre>
    <div class="prov"><span>fixture: packages/dot/__fixtures__/defineApp.basic.ts</span><a href="#">view ↗</a></div>
  </div>
</div></body></html>
