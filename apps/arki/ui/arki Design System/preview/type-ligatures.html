<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Type — Code ligatures (Fira Code)</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
  .lead { font-family: var(--font-sans); font-size: 12px; color: var(--muted-foreground); line-height: 17px; }
  .lead b { color: var(--foreground); font-weight: 500; }
  .code {
    font-family: "Fira Code", monospace;
    font-feature-settings: "calt", "liga", "ss01", "ss02";
    font-variant-ligatures: contextual;
    font-size: 14px; line-height: 22px;
    color: var(--foreground);
    background: var(--muted); border: 1px solid var(--border); border-radius: 4px;
    padding: 10px 14px;
  }
  .kw  { color: #f97583; }
  .fn  { color: #b392f0; }
  .str { color: #9ecbff; }
  .num { color: #f0a868; }
  .com { color: var(--muted-foreground); font-style: italic; }
  .ligs { font-family: "Fira Code", monospace; font-feature-settings: "calt", "liga"; font-size: 18px; color: var(--accent); letter-spacing: 0.08em; }
</style></head>
<body><div class="card">
  <div class="lead">In code blocks, <b>Fira Code</b> renders these as single glyphs:</div>
  <div class="ligs">=&gt;&nbsp;&nbsp;!==&nbsp;&nbsp;==&nbsp;&nbsp;&gt;=&nbsp;&nbsp;&lt;=&nbsp;&nbsp;-&gt;&nbsp;&nbsp;|&gt;&nbsp;&nbsp;&amp;&amp;&nbsp;&nbsp;||&nbsp;&nbsp;??&nbsp;&nbsp;::&nbsp;&nbsp;**</div>
  <div class="code">
    <span class="kw">const</span> ok = result !== <span class="kw">null</span> &amp;&amp; result.status &gt;= <span class="num">200</span>;<br/>
    <span class="kw">const</span> next = arr |&gt; map(<span class="fn">fn</span>) |&gt; reduce(<span class="fn">sum</span>);<br/>
    <span class="kw">return</span> ok ? <span class="str">"ready"</span> : <span class="str">"failed"</span>; <span class="com">// =&gt; "ready"</span>
  </div>
</div></body></html>
