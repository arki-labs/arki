<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing — Scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 18px 24px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: 70px 80px 1fr; align-items: center; gap: 12px; }
  .k { font-family: var(--font-mono); font-size: 11px; color: var(--accent); }
  .v { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); }
  .bar { background: var(--accent); height: 8px; border-radius: 2px; }
  .note { font-family: var(--font-sans); font-size: 11px; color: var(--muted-foreground); margin-top: 4px; }
</style></head>
<body><div class="card">
  <div class="row"><span class="k">--space-1</span><span class="v">4 px</span><span class="bar" style="width: 4px"></span></div>
  <div class="row"><span class="k">--space-2</span><span class="v">8 px</span><span class="bar" style="width: 8px"></span></div>
  <div class="row"><span class="k">--space-3</span><span class="v">12 px</span><span class="bar" style="width: 12px"></span></div>
  <div class="row"><span class="k">--space-4</span><span class="v">16 px</span><span class="bar" style="width: 16px"></span></div>
  <div class="row"><span class="k">--space-6</span><span class="v">24 px</span><span class="bar" style="width: 24px"></span></div>
  <div class="row"><span class="k">--space-8</span><span class="v">32 px</span><span class="bar" style="width: 32px"></span></div>
  <div class="row"><span class="k">--space-12</span><span class="v">48 px</span><span class="bar" style="width: 48px"></span></div>
  <div class="row"><span class="k">--space-16</span><span class="v">64 px</span><span class="bar" style="width: 64px"></span></div>
  <div class="note">Base unit 4px. Card padding 16 (4×). Inter-card gap 12 (3×). Section gap 64 (16×). Touch target 44 floor.</div>
</div></body></html>
