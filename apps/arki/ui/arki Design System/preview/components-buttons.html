<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Components — Buttons</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn {
    height: 36px; padding: 0 16px; border-radius: 4px;
    font-family: var(--font-sans); font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid transparent; cursor: pointer;
  }
  .btn.primary { background: var(--primary); color: var(--primary-foreground); }
  .btn.accent  { background: var(--accent); color: var(--accent-foreground); }
  .btn.secondary { background: transparent; color: var(--foreground); border-color: var(--border); }
  .btn.ghost { background: transparent; color: var(--muted-foreground); }
  .btn.destructive { background: var(--destructive); color: #fff; }
  .btn.disabled { opacity: 0.6; cursor: not-allowed; }
  .btn .mono { font-family: var(--font-mono); font-size: 12px; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); width: 80px; }
</style></head>
<body><div class="card">
  <div class="row"><span class="label">PRIMARY</span>
    <button class="btn accent"><span class="mono">bun add @arki/dot</span></button>
    <button class="btn primary">Read the docs</button>
    <button class="btn secondary">View on GitHub</button>
    <button class="btn ghost">Cancel</button>
  </div>
  <div class="row"><span class="label">STATES</span>
    <button class="btn accent">Default</button>
    <button class="btn accent" style="background: hsl(43 96% 50%)">Hover</button>
    <button class="btn accent" style="box-shadow: inset 0 0 0 999px rgba(0,0,0,0.08)">Pressed</button>
    <button class="btn accent disabled">Disabled</button>
  </div>
  <div class="row"><span class="label">SIZE</span>
    <button class="btn accent" style="height: 28px; font-size: 12px; padding: 0 10px;">sm</button>
    <button class="btn accent">md (default · 36px)</button>
    <button class="btn accent" style="height: 44px; font-size: 14px; padding: 0 20px;">lg (44px floor)</button>
  </div>
</div></body></html>
