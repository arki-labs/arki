<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Brand — Banned words</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 18px 22px; display: flex; flex-direction: column; gap: 10px; }
  .h { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); letter-spacing: 0.04em; text-transform: uppercase; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .word {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px;
    font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground);
    text-decoration: line-through; text-decoration-color: #e75858; text-align: center;
  }
  .note { font-family: var(--font-sans); font-size: 11px; color: var(--muted-foreground); line-height: 16px; }
  .note b { color: var(--foreground); font-weight: 500; }
</style></head>
<body><div class="card">
  <div class="h">Banned in chrome (binding · brand kit §Voice)</div>
  <div class="grid">
    <div class="word">!</div>
    <div class="word">AI-powered</div>
    <div class="word">blazing fast</div>
    <div class="word">10x</div>
    <div class="word">revolutionary</div>
    <div class="word">just</div>
    <div class="word">simply</div>
    <div class="word">magic</div>
    <div class="word">leverage</div>
    <div class="word">unlock</div>
    <div class="word">unleash</div>
    <div class="word">supercharge</div>
    <div class="word">next-gen</div>
    <div class="word">fully typed*</div>
    <div class="word">boilerplate</div>
    <div class="word">🚀 / emoji</div>
  </div>
  <div class="note">* unless the inference is shown beside the claim in code. Use <b>agent-native</b>, not "AI-powered".</div>
</div></body></html>
