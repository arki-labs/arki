<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing — Radii</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 24px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; align-items: end; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 80px; height: 60px; background: var(--muted); border: 1px solid var(--border); }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--foreground); text-align: center; }
  .sub { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); }
</style></head>
<body><div class="card">
  <div class="item"><div class="box" style="border-radius: 0"></div><div class="lbl">0px</div><div class="sub">—</div></div>
  <div class="item"><div class="box" style="border-radius: 4px"></div><div class="lbl">4px</div><div class="sub">button · input</div></div>
  <div class="item"><div class="box" style="border-radius: 6px"></div><div class="lbl">6px</div><div class="sub">card</div></div>
  <div class="item"><div class="box" style="border-radius: 8px"></div><div class="lbl">8px</div><div class="sub">sheet · dialog</div></div>
  <div class="item"><div class="box" style="border-radius: 9999px; width: 100px; height: 24px"></div><div class="lbl">9999px</div><div class="sub">status pill</div></div>
</div></body></html>
