<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Colors — Semantic</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 18px 24px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sw { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--border); border-radius: 6px; }
  .swatch { height: 28px; border-radius: 4px; }
  .name { font-family: var(--font-mono); font-size: 11px; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); }
  .note { font-family: var(--font-sans); font-size: 11px; color: var(--muted-foreground); margin-top: 10px; line-height: 16px; }
</style></head>
<body><div class="card">
  <div class="row">
    <div class="sw"><div class="swatch" style="background:#4ade80"></div><div class="name" style="color:#4ade80">success</div><div class="hex">142 65% 55%</div></div>
    <div class="sw"><div class="swatch" style="background:#fbbf24"></div><div class="name" style="color:#fbbf24">warning</div><div class="hex">43 96% 60%</div></div>
    <div class="sw"><div class="swatch" style="background:#60a5fa"></div><div class="name" style="color:#60a5fa">info</div><div class="hex">217 85% 65%</div></div>
    <div class="sw"><div class="swatch" style="background:#cb2c2c"></div><div class="name" style="color:#cb2c2c">destructive</div><div class="hex">0 63% 50%</div></div>
  </div>
  <div class="note">Status pills always carry icon + text + color — never color alone (no color-only signaling, binding A11y floor).</div>
</div></body></html>
