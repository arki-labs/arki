<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Components — Card chrome</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 18px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pkg {
    background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 14px;
  }
  .pkg .head { display: flex; justify-content: space-between; align-items: center; }
  .pkg .name { font-family: var(--font-mono); font-size: 13px; color: var(--foreground); font-weight: 500; }
  .pkg .v    { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); }
  .pkg .desc { font-family: var(--font-sans); font-size: 12px; color: var(--muted-foreground); line-height: 18px; margin-top: 6px; }
  .pkg .meta { display: flex; gap: 10px; margin-top: 10px; }
  .pkg .pill {
    height: 18px; padding: 0 8px; border-radius: 9999px;
    font-family: var(--font-mono); font-size: 10px; display: inline-flex; align-items: center; gap: 5px;
  }
  .pkg .pill.success { background: hsl(142 65% 55% / 0.16); color: #4ade80; }
  .pkg .stats { font-family: var(--font-mono); font-size: 10px; color: var(--muted-foreground); }
</style></head>
<body><div class="card">
  <div class="pkg">
    <div class="head"><span class="name">@arki/dot</span><span class="v">v0.1.0</span></div>
    <div class="desc">Tiny multi-runtime kernel. Plugin (Pip) graph. Lifecycle hooks. ~9 KB.</div>
    <div class="meta"><span class="pill success">● ready</span><span class="stats">npm pack 9.2 KB · 7 files</span></div>
  </div>
  <div class="pkg">
    <div class="head"><span class="name">@arki/db</span><span class="v">v0.1.0</span></div>
    <div class="desc">Package-owned database adapter. Postgres, MySQL, SQLite.</div>
    <div class="meta"><span class="pill success">● ready</span><span class="stats">npm pack 14.4 KB · 12 files</span></div>
  </div>
</div></body></html>
