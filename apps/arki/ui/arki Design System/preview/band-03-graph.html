<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Footer band — 03 Graph</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; }
  .band { background: var(--background); height: 168px; display: grid; grid-template-columns: 200px 1fr; align-items: center; }
  .side { height: 100%; padding: 18px 20px; border-right: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center;
    background: linear-gradient(90deg, transparent, hsl(240 6% 14% / 0.25)); }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; }
  .title { font-family: var(--font-sans); font-size: 18px; font-weight: 600; color: var(--foreground); margin-top: 4px; letter-spacing: -0.01em; }
  .sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); margin-top: 4px; }
  svg text { font-family: var(--font-mono); }
</style></head>
<body><div class="card"><div class="band">
  <div class="side">
    <div class="tag">graph</div>
    <div class="title">plugin lattice</div>
    <div class="sub">dot explain --graph</div>
  </div>
  <svg viewBox="0 0 500 168" style="width:100%;height:168px;display:block" preserveAspectRatio="xMidYMid meet">
    <!-- edges -->
    <line x1="250" y1="80" x2="100" y2="38" stroke="hsl(240 6% 18%)" stroke-width="1"/>
    <line x1="250" y1="80" x2="60"  y2="90" stroke="hsl(240 6% 18%)" stroke-width="1"/>
    <line x1="250" y1="80" x2="100" y2="130" stroke="hsl(240 6% 18%)" stroke-width="1"/>
    <line x1="250" y1="80" x2="400" y2="38" stroke="hsl(240 6% 18%)" stroke-width="1"/>
    <line x1="250" y1="80" x2="440" y2="90" stroke="hsl(240 6% 18%)" stroke-width="1"/>
    <line x1="250" y1="80" x2="400" y2="130" stroke="hsl(240 6% 18%)" stroke-width="1"/>

    <!-- pulses -->
    <circle r="2.5" fill="hsl(43 96% 56%)">
      <animateMotion dur="2.8s" begin="0s" repeatCount="indefinite" path="M 250 80 L 100 38"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.8s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="hsl(43 96% 56%)">
      <animateMotion dur="2.8s" begin="0.4s" repeatCount="indefinite" path="M 250 80 L 60 90"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="hsl(43 96% 56%)">
      <animateMotion dur="2.8s" begin="0.8s" repeatCount="indefinite" path="M 250 80 L 100 130"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="hsl(43 96% 56%)">
      <animateMotion dur="2.8s" begin="1.2s" repeatCount="indefinite" path="M 250 80 L 400 38"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="hsl(43 96% 56%)">
      <animateMotion dur="2.8s" begin="1.6s" repeatCount="indefinite" path="M 250 80 L 440 90"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.8s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="hsl(43 96% 56%)">
      <animateMotion dur="2.8s" begin="2.0s" repeatCount="indefinite" path="M 250 80 L 400 130"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.8s" begin="2.0s" repeatCount="indefinite"/>
    </circle>

    <!-- satellites -->
    <g><circle cx="100" cy="38" r="13" fill="#111113" stroke="hsl(240 6% 35%)"/><text x="100" y="66" text-anchor="middle" font-size="10" fill="#94949c">env</text></g>
    <g><circle cx="60"  cy="90" r="13" fill="#111113" stroke="hsl(240 6% 35%)"/><text x="60"  y="118" text-anchor="middle" font-size="10" fill="#94949c">db</text></g>
    <g><circle cx="100" cy="130" r="13" fill="#111113" stroke="hsl(240 6% 35%)"/><text x="100" y="158" text-anchor="middle" font-size="10" fill="#94949c">kv</text></g>
    <g><circle cx="400" cy="38" r="13" fill="#111113" stroke="hsl(43 96% 60% / 0.5)"/><text x="400" y="66" text-anchor="middle" font-size="10" fill="#94949c">auth</text></g>
    <g><circle cx="440" cy="90" r="13" fill="#111113" stroke="hsl(43 96% 60% / 0.5)"/><text x="440" y="118" text-anchor="middle" font-size="10" fill="#94949c">queue</text></g>
    <g><circle cx="400" cy="130" r="13" fill="#111113" stroke="hsl(43 96% 60% / 0.5)"/><text x="400" y="158" text-anchor="middle" font-size="10" fill="#94949c">rpc</text></g>

    <!-- kernel + pulsing ring -->
    <g>
      <circle cx="250" cy="80" r="22" fill="hsl(43 96% 56% / 0.12)" stroke="hsl(43 96% 56%)" stroke-width="1.5"/>
      <circle cx="250" cy="80" r="26" fill="none" stroke="hsl(43 96% 56%)" stroke-width="1" opacity="0.4">
        <animate attributeName="r" values="24;32;24" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <text x="250" y="116" text-anchor="middle" font-size="11" fill="#94949c">@arki/dot</text>
    </g>
  </svg>
</div></div></body></html>
