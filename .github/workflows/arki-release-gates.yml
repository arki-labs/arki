name: ARKI Release Gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tooling/**'
      - 'arki.release.config.ts'
      - '.changeset/**'
      - '.github/workflows/arki-release-gates.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tooling/**'
      - 'arki.release.config.ts'
      - '.changeset/**'
      - '.github/workflows/arki-release-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arki-release-${{ github.head_ref || github.ref_name }}
  # Only PR runs are replaced by a newer push; master/tag runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  # Quiet the changesets/turbo telemetry noise in CI logs.
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  # Must match "packageManager" in the root package.json.
  BUN_VERSION: '1.4.2'

jobs:
  scorecard:
    name: Scorecard + Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Setup pnpm (for fixture matrix install stage)
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck arki-release tooling
        run: bun --filter '@arki/arki-release' typecheck

      - name: Test arki-release tooling
        run: bun --filter '@arki/arki-release' test

      - name: Inventory
        run: bun run release:arki inventory --json > scorecard-inventory.json
        continue-on-error: true

      - name: Audit (leak scan)
        run: bun run release:arki audit --json > scorecard-audit.json
        continue-on-error: true

      - name: Pack audit
        run: bun run release:arki pack --json > scorecard-pack.json
        continue-on-error: true

      - name: Export public tree
        run: bun run release:arki export-public --json > scorecard-export.json
        continue-on-error: true

      - name: Fixture matrix (full install)
        # Full install matrix is slow but mandatory in CI to validate that
        # the materialized public tree installs with npm, pnpm, AND Bun.
        # On PRs we still run it; if runtime becomes a problem, switch to
        # --skip-install here and rely on a nightly job for the full matrix.
        run: bun run release:arki fixture --json > scorecard-fixture.json
        continue-on-error: true

      - name: List affected public packages
        run: |
          bun -e '
            const sh = (cmd) => new TextDecoder().decode(Bun.spawnSync(cmd).stdout);
            const changed = sh(["git", "diff", "--name-only", "origin/main...HEAD"]).split("\n").filter(Boolean);
            const inventory = JSON.parse(sh(["bun", "run", "release:arki", "inventory", "--json"]));
            const names = inventory.items
              .filter((pkg) => pkg.status === "candidate")
              .filter((pkg) => changed.some((file) => file.startsWith(pkg.manifestPath.replace(/package\.json$/, ""))))
              .map((pkg) => pkg.name);
            await Bun.write("affected.json", JSON.stringify(names));
            console.log("Affected public packages:", names.length === 0 ? "(none)" : names.join(", "));
          '

      - name: Scorecard (machine output)
        id: scorecard
        run: |
          set +e
          bun run release:arki scorecard --json --full-fixture > scorecard.json
          scorecard_exit=$?
          set -e
          echo "scorecard_exit=$scorecard_exit" >> "$GITHUB_OUTPUT"

      - name: Scorecard (human output)
        run: bun run release:arki scorecard --full-fixture || true

      - name: Surface gate decision
        run: |
          gate=$(jq -r '.summary.stableReleaseGate' scorecard.json)
          echo "stableReleaseGate=$gate" >> "$GITHUB_ENV"
          echo "Scorecard gate: $gate"
          jq -r '.summary.message' scorecard.json
          echo ""
          echo "Blockers:"
          jq -r '.summary.stableReleaseBlockers[]?' scorecard.json | sed 's/^/  - /'

      - name: Upload scorecard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arki-release-scorecard
          path: |
            scorecard-inventory.json
            scorecard-audit.json
            scorecard-pack.json
            scorecard-export.json
            scorecard-fixture.json
            scorecard.json
          retention-days: 30

      - name: Fail on scorecard tool error (exit code 2)
        if: steps.scorecard.outputs.scorecard_exit == '2'
        run: |
          echo "::error::Scorecard crashed or got bad flags (exit code 2)."
          exit 1

      - name: Fail PR on admission or docs-impact for affected packages
        if: github.event_name == 'pull_request'
        run: |
          bun -e '
            const scorecard = JSON.parse(await Bun.file("scorecard.json").text());
            const affected = new Set(JSON.parse(await Bun.file("affected.json").text()));
            const failures = scorecard.items
              .filter((pkg) => affected.has(pkg.name))
              .flatMap((pkg) => ["admission", "docs-impact"]
                .filter((dimension) => pkg.dimensions[dimension].status === "fail")
                .map((dimension) => pkg.name + ": " + dimension + " - " + pkg.dimensions[dimension].details));
            for (const failure of failures) console.log("::error::" + failure);
            if (failures.length > 0) process.exit(1);
            console.log("admission and docs-impact pass for all affected packages.");
          '

      - name: Fail on blocked gate (release branches / tags only)
        # PRs surface the gate as a check but don't block — the merge can
        # land with deferred items. Tags + master pushes require the gate
        # to be open.
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
          startsWith(github.ref, 'refs/tags/')
        env:
          GATE: ${{ env.stableReleaseGate }}
        run: |
          if [ "$GATE" != "open" ]; then
            echo "::error::Stable release gate is blocked on a release-trigger branch/tag. Failing the workflow."
            exit 1
          fi
          echo "Stable release gate is open."

      - name: Annotate PR (advisory, non-blocking)
        if: github.event_name == 'pull_request'
        env:
          GATE: ${{ env.stableReleaseGate }}
        run: |
          if [ "$GATE" != "open" ]; then
            echo "::warning::Stable release gate is currently blocked. Merging is permitted (PR mode); fix the blockers before tagging a release."
          fi

  library:
    name: Library check + layers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Library check
        run: bun run library-check

      - name: Layers
        run: bun run layers

  docs:
    name: Docs examples (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Test docs for affected packages
        run: bun run turbo run test:docs --filter='...[origin/main]'

  runtimes:
    name: Runtimes (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Test runtimes for affected packages
        run: bun run turbo run test:runtimes --filter='...[origin/main]'

  smoke:
    name: Candidate smoke (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: List affected public packages
        id: affected
        run: |
          bun -e '
            const sh = (cmd) => new TextDecoder().decode(Bun.spawnSync(cmd).stdout);
            const changed = sh(["git", "diff", "--name-only", "origin/main...HEAD"]).split("\n").filter(Boolean);
            const inventory = JSON.parse(sh(["bun", "run", "release:arki", "inventory", "--json"]));
            const names = inventory.items
              .filter((pkg) => pkg.status === "candidate")
              .filter((pkg) => changed.some((file) => file.startsWith(pkg.manifestPath.replace(/package\.json$/, ""))))
              .map((pkg) => pkg.name);
            console.log("Affected public packages:", names.length === 0 ? "(none)" : names.join(", "));
            if (names.length === 0) console.log("Skipping smoke: no public package changed.");
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "count=" + names.length + "\n");
          '

      - name: Freeze affected candidate
        id: candidate
        if: steps.affected.outputs.count != '0'
        run: |
          bun run release:arki candidate --affected origin/main --json > candidate-out.json
          dir=$(jq -r '.summary.directory' candidate-out.json)
          echo "directory=$dir" >> "$GITHUB_OUTPUT"

      - name: Smoke the candidate
        if: steps.affected.outputs.count != '0'
        run: bun run release:arki smoke --candidate "${{ steps.candidate.outputs.directory }}" --json

      - name: Upload candidate.json
        if: always() && steps.candidate.outputs.directory != ''
        uses: actions/upload-artifact@v4
        with:
          name: arki-release-candidate
          path: ${{ steps.candidate.outputs.directory }}/candidate.json
          retention-days: 30

  exclusions:
    name: Intentional exclusions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [scorecard, library, docs, runtimes, smoke]
    if: always()
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Print every intentional exclusion
        run: |
          baseline=tooling/arki-release/readiness-baseline.json
          echo "Readiness baseline: $(jq 'length' "$baseline") packages, $(jq '[.[] | length] | add' "$baseline") known-failing checks excluded."
          bun run release:arki inventory --json > inventory.json
          echo "Packages in notYet: $(jq '[.items[] | select(.status == "not-yet")] | length' inventory.json)"
          jq -r '.items[] | select(.status == "not-yet") | "  notYet: " + .name' inventory.json
          echo "Unadmitted public packages: $(jq '[.items[] | select(.status == "unadmitted")] | length' inventory.json)"
          jq -r '.items[] | select(.status == "unadmitted") | "  unadmitted: " + .name' inventory.json
          if [ -d demos ]; then
            echo "Demo checks: demos/ is present in this clone."
          else
            echo "Demo checks skipped: demos/ is not in this clone."
          fi
          echo "Job results: scorecard=${{ needs.scorecard.result }} library=${{ needs.library.result }} docs=${{ needs.docs.result }} runtimes=${{ needs.runtimes.result }} smoke=${{ needs.smoke.result }}"
